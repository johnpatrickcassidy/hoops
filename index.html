<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoops">
<title>Hoops</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --ink: #14213D; --ink-2: #4A5568; --muted: #6B7689; --line: #DCE1E8;
  --us: #1F5FBF; --them: #D9661A; --mid: #E4E7EC; --amber: #F2B705; --amber-ink: #6B4E00; --amber-bg: #FFF6D6;
  --good: #0B7A0B; --bug: #14213D; --bug-ink: #F4F6F9; --bug-2: #A9B4C7; --bug-mid: #2A3651;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --text: 'Barlow', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131B2B; --surface: #1B2538; --ink: #EEF2F7; --ink-2: #B6C0CF; --muted: #8592A6; --line: #2A364C;
    --us: #4A86DC; --them: #DD7426; --mid: #2C374B; --amber-ink: #FFD866; --amber-bg: #3A3210;
    --good: #4CC24C; --bug: #0E1524; --bug-ink: #EEF2F7; --bug-2: #8592A6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131B2B; --surface: #1B2538; --ink: #EEF2F7; --ink-2: #B6C0CF; --muted: #8592A6; --line: #2A364C;
  --us: #4A86DC; --them: #DD7426; --mid: #2C374B; --amber-ink: #FFD866; --amber-bg: #3A3210;
  --good: #4CC24C; --bug: #0E1524; --bug-ink: #EEF2F7; --bug-2: #8592A6; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--text); font-variant-numeric: tabular-nums;
       -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--us); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* lock screen */
#lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
#lock form { width: 100%; max-width: 360px; }
.mark { font: 800 64px/0.9 var(--display); letter-spacing: 0.01em; margin: 0 0 8px; }
.mark span { display: block; font: 600 20px/1.2 var(--display); color: var(--muted); letter-spacing: 0.02em; }
#lock label { display: block; font-weight: 600; margin: 28px 0 6px; }
#lock input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
       background: var(--surface); font-size: 17px; }
.check { display: flex; gap: 8px; align-items: center; margin: 12px 0 20px; color: var(--ink-2); font-weight: 400 !important; }
.btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; cursor: pointer;
       background: var(--ink); color: var(--bg); }
.btn.wide { width: 100%; font-size: 17px; }
.btn.quiet { background: transparent; color: var(--ink-2); border: 1px solid var(--line); padding: 8px 14px; }
.err { color: var(--them); margin-top: 12px; min-height: 1.4em; }

/* scorebug */
.bug { position: sticky; top: 0; z-index: 5; background: var(--bug); color: var(--bug-ink);
       padding: calc(env(safe-area-inset-top) + 10px) 0 10px; }
.bug .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bug .score { font: 800 34px/1 var(--display); letter-spacing: 0.01em; white-space: nowrap; }
.bug .score .them { color: var(--bug-2); }
.bug .who { font-size: 14px; color: var(--bug-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bug .who b { color: var(--bug-ink); font-weight: 600; }
.lights { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-top: 10px; }
.light { border-radius: 5px; padding: 5px 0 4px; text-align: center; font: 600 15px/1 var(--display); color: var(--bug-ink);
         background: var(--bug-mid); letter-spacing: 0.02em; border: 0; cursor: pointer; }
.light.pg { color: var(--ink); cursor: default; }
.light.pg small { color: var(--ink-2); opacity: 1; }
.light small { display: block; font: 500 11px/1.2 var(--text); color: var(--bug-ink); opacity: 0.85; margin-top: 2px; }

/* layout */
main.page { padding: 16px 0 calc(env(safe-area-inset-bottom) + 84px); }
h2 { font: 800 28px/1.05 var(--display); margin: 26px 0 10px; letter-spacing: 0.01em; }
h2:first-child { margin-top: 6px; }
h3 { font: 600 17px/1.3 var(--text); margin: 18px 0 6px; }
p { margin: 6px 0; }
.sub { color: var(--muted); font-size: 14px; }
.note { color: var(--ink-2); font-size: 15px; }

/* action and status blocks */
.act { border-radius: 12px; padding: 14px 16px; margin: 10px 0; background: var(--amber-bg); color: var(--ink);
       border-left: 5px solid var(--amber); }
.act strong { display: block; font-size: 17px; margin-bottom: 4px; color: var(--amber-ink); }
.ok { display: flex; gap: 10px; align-items: center; padding: 12px 0; color: var(--ink-2); }
.ok svg { flex: none; color: var(--good); }
.banner { border-radius: 10px; padding: 10px 14px; background: var(--mid); color: var(--ink-2); font-size: 15px; margin: 6px 0 12px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); }
.list > li { padding: 11px 14px; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.pl { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
.slot { font: 600 15px/1 var(--display); color: var(--ink-2); text-align: center; border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 0; letter-spacing: 0.02em; }
.slot.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.nm { font-weight: 600; line-height: 1.25; }
.meta { font-size: 13.5px; color: var(--muted); }
.rt { text-align: right; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
        background: var(--mid); color: var(--ink); vertical-align: 1px; margin-left: 4px; }
.chip.out { background: var(--them); color: #fff; }
.chip.risk { background: var(--amber); color: #3B2B00; }
.chip.fa { background: transparent; border: 1px solid var(--us); color: var(--ink); }
.chip.me { background: var(--us); color: #fff; }
.list > li.mine { box-shadow: inset 3px 0 0 var(--us); }
.list > li.tap { cursor: pointer; }
.list > li .split + .split { margin-top: 5px; }
.tbl tr.cut td { border-bottom: 2px solid var(--ink-2); }
.chg { color: var(--amber-ink); font-weight: 600; font-size: 13.5px; }
.riskline { margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--amber-bg); color: var(--amber-ink);
            border-left: 4px solid var(--amber); font-size: 13.5px; }

/* moves */
.mv .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.gain { font: 800 24px/1 var(--display); white-space: nowrap; }
.gain small { font: 500 12px/1 var(--text); color: var(--muted); margin-left: 3px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cat { font-size: 12.5px; padding: 2px 7px; border-radius: 6px; background: var(--mid); }
.cat i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* category range plots: two lanes per category on one scale; hollow dot = now, filled dot = projected final,
   band = where the final lands 8 weeks in 10 (yfb/sim.py distributions) */
.list.crs > li.cr { padding: 10px 14px 9px; }
.cr-h { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.cr-h .k { font: 600 17px/1 var(--display); letter-spacing: 0.02em; min-width: 40px; }
.cr-h .st { flex: 1; font-size: 13px; color: var(--ink-2); }
.lane { display: grid; grid-template-columns: 54px 1fr 92px; align-items: center; gap: 8px; height: 22px; --c: var(--us); }
.lane.them { --c: var(--them); }
.lane .who { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .v { text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lane .v b { color: var(--ink); font-size: 14px; font-weight: 700; margin-right: 5px; }
.rp { position: relative; height: 16px; }
.rp::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.rp i { position: absolute; display: block; }
.rp .band { top: 4px; height: 8px; border-radius: 4px; background: var(--c); opacity: 0.25; min-width: 2px; }
.rp .seg { top: 7px; height: 2px; background: var(--c); }
.rp .dot { top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); }
.rp .dot.fin { background: var(--c); }
.rp .dot.now { background: var(--surface); border: 2px solid var(--c); width: 8px; height: 8px; }
.legend.rl { flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin: 8px 2px 8px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .mk { width: 12px; height: 10px; border-radius: 0; margin-right: 5px; position: relative; vertical-align: -1px; }
.legend .mk.now::after, .legend .mk.fin::after { content: ''; position: absolute; left: 2px; top: 1px; width: 8px; height: 8px; border-radius: 50%; }
.legend .mk.now::after { border: 2px solid var(--ink-2); width: 4px; height: 4px; }
.legend .mk.fin::after { background: var(--ink-2); }
.legend .mk.band { height: 8px; border-radius: 4px; background: var(--ink-2); opacity: 0.3; width: 18px; }
.pill { display: inline-block; min-width: 44px; margin-left: 6px; padding: 2px 6px; border-radius: 7px; text-align: center;
        font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.list > li.tap { cursor: pointer; }
.tap .chev { display: inline-block; width: 14px; margin-left: 4px; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s; text-align: center; }
.tap.open > .split .chev, .tap.open > div > .rt .chev { transform: rotate(90deg); }
.det { margin: 10px -4px 2px; cursor: default; }
.det .list { background: var(--bg); }
.btn.quiet[data-week] { font-size: 14px; }
.legend { display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-2); margin: 6px 2px 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stats b { display: block; font: 800 26px/1 var(--display); }
.stats span { font-size: 13px; color: var(--muted); }

/* players */
.tools { display: grid; gap: 8px; margin-bottom: 10px; }
.tools input, .tools select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px;
              font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pr { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; cursor: pointer; }
.pr .n { color: var(--muted); font-size: 13px; text-align: right; }
.pr .v { font: 800 20px/1 var(--display); text-align: right; }
.pr .v small { display: block; font: 500 11.5px/1.3 var(--text); color: var(--muted); }
.detail { margin: 10px 0 2px 38px; font-size: 14px; color: var(--ink-2); }
.zs { display: grid; grid-template-columns: 38px 1fr 40px; gap: 6px 8px; align-items: center; margin: 8px 0; }
.zs .k { font: 600 14px/1 var(--display); letter-spacing: 0.02em; color: var(--ink); }
.zs .z { font-size: 12.5px; text-align: right; }
.ztrack { position: relative; height: 8px; background: var(--mid); border-radius: 3px; }
.ztrack .zero { position: absolute; left: 40%; top: -2px; bottom: -2px; width: 2px; background: var(--muted); opacity: 0.6; }
.ztrack .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.more { display: block; margin: 12px auto 0; }

/* league table */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; background: var(--surface);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { padding: 8px 2px; text-align: center; border-top: 1px solid var(--line); min-width: 22px; }
.tbl thead th { border-top: 0; font: 600 13px/1 var(--display); letter-spacing: 0.03em; color: var(--ink-2); }
.tbl td.team { text-align: left; padding-left: 10px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl tr.me td { font-weight: 700; }
.tbl td.r { font-weight: 600; }
.scroll { overflow-x: auto; }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
           padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 4px; }
nav.tabs button { appearance: none; background: none; border: 0; padding: 12px 0 13px; font-size: 14px; font-weight: 600;
                  color: var(--muted); cursor: pointer; position: relative; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
                  border-radius: 0 0 3px 3px; background: var(--us); }
.split { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 28px; }

/* model explainer, teams, player panel (wider on desktop) */
@media (min-width: 900px) { body.wide .wrap { max-width: 1000px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
.card > h3:first-child { margin-top: 0; }
.dt { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); }
.dt th, .dt td { padding: 6px 7px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
.dt thead th { border-top: 0; font: 600 13px/1.1 var(--display); letter-spacing: 0.03em; color: var(--ink-2); vertical-align: bottom; }
.dt th:first-child, .dt td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.dt td.l, .dt th.l { text-align: left; }
.dt tr.hi td { font-weight: 700; }
.dt tr.sub td { color: var(--muted); border-top: 0; padding-top: 0; font-size: 12.5px; }
.dt tr.sep td { border-top: 2px solid var(--line); }
.dt .d { color: var(--muted); font-size: 12px; margin-left: 3px; }
.dt .big { font-weight: 700; color: var(--ink); }
.dt button.lnk, .lnk { appearance: none; background: none; border: 0; padding: 0; color: var(--us); font-weight: 600; cursor: pointer; text-align: left; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 8px 0; }
.formula { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--mid); color: var(--ink); padding: 10px 14px;
           border-radius: 10px; overflow-x: auto; white-space: pre; margin: 8px 0; }
.mx p, .mx li { color: var(--ink-2); }
.mx p b, .mx li b { color: var(--ink); }
.mx ol, .mx ul { padding-left: 22px; margin: 6px 0; }
.mx li { margin: 4px 0; }
.mx h2 { margin-top: 34px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
.tiles div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tiles b { display: block; font: 800 28px/1 var(--display); }
.tiles span { font-size: 13px; color: var(--muted); }
.wbar { display: flex; gap: 2px; height: 10px; min-width: 90px; border-radius: 4px; overflow: hidden; background: var(--mid); }
.wbar i { display: block; height: 100%; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.ctl { display: grid; gap: 4px; margin: 10px 0; }
.ctl label { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.ctl label output { font-weight: 400; color: var(--ink-2); }
input[type=range] { width: 100%; accent-color: var(--us); }
textarea { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
           font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.row2 select, .row2 input[type=search] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.row2 input[type=search] { flex: 1 1 260px; }
.row2 select { max-width: 100%; }
.back { margin: 4px 0 0; }
.dots { position: relative; height: 18px; }
.dots .ax { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--mid); border-radius: 1px; }
.dots .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--surface); }
.dots .ceil { position: absolute; top: 1px; width: 2px; height: 16px; margin-left: -1px; background: var(--ink-2); opacity: 0.7; }
.dots .zero { position: absolute; top: 0; width: 1px; height: 18px; background: var(--muted); opacity: 0.6; }
.skill { display: grid; grid-template-columns: 52px 1fr 92px; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.skill .k { font: 600 14px/1 var(--display); letter-spacing: 0.02em; }
.skill .n { text-align: right; color: var(--ink-2); white-space: nowrap; }
.skill .n b { color: var(--ink); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--mid); font-size: 12.5px; margin: 2px 2px 2px 0; }
details > summary { cursor: pointer; color: var(--us); font-weight: 600; margin: 8px 0; }
/* moves for both teams: deltas, title odds filled in as each season simulation finishes */
.dlt { font-size: 12px; font-weight: 600; margin-left: 4px; color: var(--muted); white-space: nowrap; }
.dlt.up { color: var(--good); }
.dlt.dn { color: var(--them); }
.tt.wait, .sub.wait { color: var(--muted); }
.mv .rt { display: flex; align-items: baseline; gap: 2px; }
.mvt td { white-space: normal; min-width: 92px; vertical-align: top; }
.mvt td.l { min-width: 120px; max-width: 170px; }
.card.fit .list { margin-top: 6px; }
.card.fit h3 + .sub { margin-top: -2px; }
@media (prefers-reduced-motion: no-preference) {
  .light { transition: background-color .3s; }
}
</style>
</head>
<body>
<main id="lock">
  <form id="unlock" autocomplete="on">
    <h1 class="mark">Hoops<span>Your fantasy team, every day</span></h1>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this phone</label>
    <button class="btn wide" id="go" type="submit">Unlock</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="bug"><div class="wrap" id="bug"></div></header>
  <main class="page"><div class="wrap" id="view"></div></main>
  <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
</div>

<script>
'use strict';
const KEY = 'hoops-pass', ITER = 600000;
const CAT = {pts: 'PTS', reb: 'REB', ast: 'AST', stl: 'STL', blk: 'BLK', tpm: '3PM', to: 'TO', fg: 'FG%', ft: 'FT%'};
const TABS = [['today', 'Today'], ['matchup', 'Matchup'], ['moves', 'Moves'], ['players', 'Players'], ['teams', 'Teams'],
              ['league', 'League'], ['model', 'Model']];
const HAS = {today: () => D.lineups, matchup: () => D.matchup, moves: () => D.streams || D.adds, league: () => D.table,
             teams: () => D.model && D.model.league, model: () => D.model, players: () => true};
let D = null, tab = 'today', P = {q: '', who: 'all', pos: 'all', sort: 'val', open: null, n: 60};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {

// ---- decrypt: openssl enc -aes-256-cbc -pbkdf2 -md sha256 format, gzip inside ----
async function decrypt(b64, pass) {
  const bytes = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  if (new TextDecoder().decode(bytes.slice(0, 8)) !== 'Salted__') throw new Error('format');
  const salt = bytes.slice(8, 16), body = bytes.slice(16);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER}, km, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, body);
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function load(pass) {
  const r = await fetch('data.enc?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('fetch');
  return decrypt(await r.text(), pass);
}

// Streams: the best pickups with every drop that helps this week. Sort by this week's gain or by the title odds after
// the move (each move's season played out first; the best drop this week can cost the most later, e.g. Vassell on
// 2026-11-10: +0.40 categories, -2.7 points of title odds).
const SM = {sort: 'week', all: false, waiting: false};
function ttDelta(mv) {                // {d, se}: change in our title odds and its standard error, points (null until played out)
  const P = tsp(), b = P.cache.get('base'), r = P.cache.get(mvEd(mv).key);
  if (!b || !r) return null;
  const N = b.myTitle.length;
  let up = 0, dn = 0;                 // same random seasons with and without the move: only the seasons that flip count
  for (let s = 0; s < N; s++) { const x = r.myTitle[s] - b.myTitle[s]; if (x > 0) up++; else if (x < 0) dn++; }
  const d = (up - dn) / N;
  return {d: d * 100, se: Math.sqrt(Math.max(0, (up + dn) / N - d * d) / N) * 100};
}
function streamList() {
  const items = D.streams.map(m => ({m, mv: canMove() && lineP(m.add.id) ? mvOf({kind: 'stream', myAdd: [m.add.id], myDrop: m.drop ? [m.drop.id] : []}) : null}));
  const title = canTitle() && items.some(x => x.mv);
  if (!title) SM.sort = 'week';
  let list = items, d = items.map(() => null);
  SM.waiting = false;
  if (title) {
    d = items.map(x => x.mv ? ttDelta(x.mv) : null);
    SM.waiting = SM.sort === 'title' && items.some((x, i) => x.mv && d[i] == null);
    if (SM.sort === 'title' && !SM.waiting)
      list = items.map((x, i) => [x, d[i] ? d[i].d : -1e9]).sort((a, b) => b[1] - a[1] || b[0].m.gain - a[0].m.gain).map(z => z[0]);
  }
  // helps both: this week, and the title by more than twice the simulation's own noise for that move
  const both = new Set(items.filter((x, i) => d[i] && d[i].d >= 0.5 && d[i].d > 2 * d[i].se && x.m.gain > 0));
  const shown = SM.sort === 'title' || SM.all ? list : list.slice(0, 8);
  const pickups = new Set(D.streams.map(m => m.add.id)).size;
  let h = `<p class="sub">The ${pickups} best pickups with every drop that helps this week: gain in expected categories won against
    ${esc(D.matchup ? D.matchup.opp_name : 'your opponent')} this week${title ? `, and your title odds after the move (the season and
    playoffs played out ${TN.toLocaleString()} times; "Helps both" only where the title gain is clearly bigger than the
    simulation's noise)` : ''}.</p>`;
  if (title) h += `<div class="seg" id="ssort">${[['week', 'Best this week'], ['title', 'Best for the title']].map(([k, l]) =>
    `<button data-v="${k}" aria-pressed="${SM.sort === k}">${l}</button>`).join('')}</div>`;
  if (SM.waiting) h += `<p class="sub wait">Playing out the season for each move to sort them…</p>`;
  h += `<ul class="list">${shown.map(x => moveItem(x.m, 'cats', 'stream', both.has(x) ? ' <span class="chip me">Helps both</span>' : '')).join('')}</ul>`;
  if (shown.length < list.length) h += `<button class="btn quiet more" id="smore">Show all ${list.length}</button>`;
  return h;
}

    <div class="scroll"><table class="tbl"><thead><tr><th style="text-align:left;padding-left:12px">Team</th><th>Wins</th>${D.cats.map(c => `<th>${CAT[c].replace('%', '')}</th>`).join('')}</tr></thead><tbody>`

// ---- category range plots: the score now (hollow dot), the projected final (filled dot) and the range the
// final lands in 8 weeks in 10 (band), for two sides on one scale per category (Matchup tab, League details) ----
const Z80 = 1.2816;
const fmtC = (c, x) => x == null ? '–' : (c === 'fg' || c === 'ft') ? x.toFixed(3).replace(/^0/, '') : Math.round(x).toString();
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function pill(p) {             // a chance on a fill leaning blue (us) or orange (them); text white or ink, whichever reads
  const bg = lean(p, 0.85), L = lum(bg), ink = lum('#14213D');
  return `<span class="pill" style="background:${bg};color:${1.05 / (L + 0.05) > (L + 0.05) / (ink + 0.05) ? '#fff' : '#14213D'}">${pct(p)}</span>`;
}
const winCell = pill;
function rangeLegend(A, B, now = true) {
  return `<div class="legend rl"><span><i class="sw" style="background:${css('--us')}"></i>${esc(A)}</span><span><i class="sw" style="background:${css('--them')}"></i>${esc(B)}</span>
    ${now ? '<span><i class="mk now"></i>Now</span>' : ''}<span><i class="mk fin"></i>Projected</span><span><i class="mk band"></i>8 in 10 range</span></div>`;
}
// A, B: {label, me, now: {cat: banked} or null, dist: {cat: [projected, sd]}}; probs: A's chance per category
function catRows(A, B, probs) {
  return '<ul class="list crs">' + D.cats.map(c => {
    const pc = c === 'fg' || c === 'ft';
    const side = S => {
      const [m, sd] = S.dist[c], now = S.now ? S.now[c] : null;
      let lo = m - Z80 * sd, hi = m + Z80 * sd;
      if (pc) { lo = Math.max(0, lo); hi = Math.min(1, hi); } else if (now != null) lo = Math.max(lo, now);   // counts only grow
      return {m, lo, hi, now};
    };
    const a = side(A), b = side(B);
    const xs = [a.lo, a.hi, a.m, b.lo, b.hi, b.m, ...[a.now, b.now].filter(v => v != null)];
    let x0 = Math.min(...xs), x1 = Math.max(...xs);
    const pad = (x1 - x0) * 0.06 || (pc ? 0.01 : 1);
    x0 -= pad; x1 += pad;
    const X = v => (v - x0) / (x1 - x0) * 100;
    const lane = (S, cls, L) => {
      const tip = `${L.label} ${CAT[c]}: ${S.now != null ? 'now ' + fmtC(c, S.now) + ', ' : ''}projected ${fmtC(c, S.m)}, 8 weeks in 10 between ${fmtC(c, S.lo)} and ${fmtC(c, S.hi)}`;
      const seg = S.now != null ? `<i class="seg" style="left:${X(Math.min(S.now, S.m)).toFixed(2)}%;width:${Math.abs(X(S.m) - X(S.now)).toFixed(2)}%"></i>
        <i class="dot now" style="left:${X(S.now).toFixed(2)}%"></i>` : '';
      return `<div class="lane ${cls}"><span class="who">${esc(L.label)}</span><div class="rp" role="img" aria-label="${esc(tip)}" title="${esc(tip)}">
        <i class="band" style="left:${X(S.lo).toFixed(2)}%;width:${(X(S.hi) - X(S.lo)).toFixed(2)}%"></i>${seg}<i class="dot fin" style="left:${X(S.m).toFixed(2)}%"></i></div>
        <span class="v"><b>${fmtC(c, S.m)}</b>${fmtC(c, S.lo)}–${fmtC(c, S.hi)}</span></div>`;
    };
    let st = `Projected ${fmtC(c, a.m)}–${fmtC(c, b.m)}`;
    if (a.now != null && b.now != null) {
      const d = (c === 'to' ? -1 : 1) * (a.now - b.now), by = pc ? Math.abs(a.now - b.now).toFixed(3).replace(/^0/, '') : Math.round(Math.abs(a.now - b.now));
      const leads = S => S.me ? 'you lead' : (A.me || B.me) ? 'they lead' : `${S.label} leads`;
      st = `Now ${fmtC(c, a.now)}–${fmtC(c, b.now)}, ${Math.abs(d) < 1e-9 ? 'tied' : (d > 0 ? leads(A) : leads(B)) + ' by ' + by}`;
    }
    if (c === 'to') st += ' (fewer wins)';
    return `<li class="cr"><div class="cr-h"><span class="k">${CAT[c]}</span><span class="st">${esc(st)}</span>${pill(probs[c])}</div>
      ${lane(a, 'us', A)}${lane(b, 'them', B)}</li>`;
  }).join('') + '</ul>';
}
// the score in categories as it stands: [A ahead, B ahead, tied]
function scoreNow(a, b) {
  const s = [0, 0, 0];
  for (const c of D.cats) {
    if (a[c] == null || b[c] == null) continue;
    const d = (c === 'to' ? -1 : 1) * (a[c] - b[c]);
    s[Math.abs(d) < 1e-9 ? 2 : d > 0 ? 0 : 1]++;
  }
  return s;
}
const scoreText = s => `${s[0]}–${s[1]}${s[2] ? '–' + s[2] : ''}`;

const flip = probs => Object.fromEntries(Object.entries(probs).map(([c, p]) => [c, 1 - p]));

function tapRow(id, inner, det, cls = '') {

      + sched.map(({x, r}) => tapRow(`s:${x.week}`,
          `<div class="split"><div><div class="nm">Week ${x.week}: ${nm(x.opp)}</div><div class="meta">${esc(span(x))}</div></div>

// ---- model explainer, teams and the player panel (data: D.model, from yfb/explain.py) ----
const KEYS = ['min', 'pts', 'reb', 'ast', 'stl', 'blk', 'tpm', 'to', 'fgm', 'fga', 'tpa', 'ftm', 'fta'];
const SRC = {ours: 'Our model only', rotowire: 'Rotowire', fantasypros: 'FantasyPros', espn: 'ESPN', hashtag: 'Hashtag'};
const RATE = {fg2a: '2PA', tpa: '3PA', fta: 'FTA', reb: 'REB', ast: 'AST', stl: 'STL', blk: 'BLK', to: 'TO'};
const PCTN = {p2: '2P%', p3: '3P%', pft: 'FT%'};
const lsj = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let X = {yid: null, back: 'players', w: {}};
let TM = {key: lsj.get('hoops-team'), cmp: null, drop: [], add: [], q: ''};
let HT = lsj.get('hoops-ht');
let MV = {hz: '14', vs: 'blend14'};
let PMC = null;
const pmap = () => (PMC && PMC.D === D) ? PMC.m : (PMC = {D, m: Object.fromEntries(D.players.map(p => [p.id, p]))}).m;
const mp = id => (D.model && D.model.players[id]) || null;
const cv = (l, c) => !l ? null : c === 'fg' ? (l.fga ? l.fgm / l.fga : null) : c === 'ft' ? (l.fta ? l.ftm / l.fta : null) : l[c];
const f1 = (x, d = 1) => x == null || isNaN(x) ? '–' : x.toFixed(d);
const fc = (c, x) => x == null || isNaN(x) ? '–' : (c === 'fg' || c === 'ft') ? x.toFixed(3).replace(/^0/, '') : x.toFixed(1);
const sum = xs => xs.reduce((a, b) => a + b, 0);

// G-scores, the same scale yfb/rater.py used for every player's value (explain.rater_scale)
function gscore(l) {
  const R = D.model.rater, z = {};
  for (const c of D.cats) {
    const v = c === 'fg' ? l.fgm - R.lfg * l.fga : c === 'ft' ? l.ftm - R.lft * l.fta : l[c];
    z[c] = (v - R.mu[c]) / R.den[c];
  }
  z.to = -z.to;
  return {z, pgv: sum(D.cats.map(c => Math.max(R.floor, Math.min(R.cap, z[c]))))};
}
function dollars(pgv, gpf) {
  const R = D.model.rater;
  return pgv > R.repl ? 1 + R.pot * (pgv - R.repl) * gpf / R.tot : 0;
}
const gpfOf = (gp, left) => left ? Math.min(1, (gp / left) / D.model.rater.full) ** 2 : 0;

// ---- what-if: redo the shrinkage with other weights, then the rest of the pipeline as fixed multipliers ----
function mixw(x, a, b) {
  const wo = x.own == null ? 0 : x.w_own, wp = x.prior == null ? 0 : x.w_prior * a, wq = x.w_pop * b;
  const den = wo + wp + wq;
  return den ? ((x.own || 0) * wo + (x.prior || 0) * wp + x.pop * wq) / den : x.post;
}
function lineOf(r, pc, m) {           // yfb/project.line without team or opponent factors
  const fg2a = r.fg2a * m, tpa = r.tpa * m, fta = r.fta * m, fg2m = fg2a * pc.p2, tpm = tpa * pc.p3, ftm = fta * pc.pft;
  return {min: m, pts: 2 * fg2m + 3 * tpm + ftm, reb: r.reb * m, ast: r.ast * m, stl: r.stl * m, blk: r.blk * m, to: r.to * m,
          tpm, tpa, fgm: fg2m + tpm, fga: fg2a + tpa, ftm, fta};
}
function oursW(m) {                    // our share of his blended line (weights renormalized over sources that cover him)
  const B = D.model.params.blend, src = Object.keys(m.src || {}).filter(s => s !== 'ours');
  return src.length ? B.ours / (B.ours + sum(src.map(s => B[s] || 0))) : 1;
}
function whatIf(id, w) {
  const m = mp(id), p = pmap()[id], pp = m && m.parts;
  if (!pp) return null;
  const a = w.prior ?? 1, b = w.pop ?? 1;
  const r0 = Object.fromEntries(Object.entries(pp.r).map(([k, x]) => [k, x.post]));
  const c0 = Object.fromEntries(Object.entries(pp.p).map(([k, x]) => [k, x.post]));
  const r1 = Object.fromEntries(Object.entries(pp.r).map(([k, x]) => [k, mixw(x, a, b)]));
  const c1 = Object.fromEntries(Object.entries(pp.p).map(([k, x]) => [k, mixw(x, a, b)]));
  const fitMin1 = Math.max(0, mixw(pp.min, a, b) + (pp.min.role || 0));
  const ours = (m.src && m.src.ours) || m.final;
  const minAuto = m.final.min * (m.fit_min ? fitMin1 / m.fit_min : 1);
  const min1 = w.min ?? minAuto, mr = m.final.min ? min1 / m.final.min : 1;   // the minutes change, as a ratio
  const l0 = lineOf(r0, c0, m.fit_min), l1 = lineOf(r1, c1, m.fit_min * mr);
  const o1 = {};
  for (const k of KEYS) o1[k] = l0[k] ? ours[k] * l1[k] / l0[k] : ours[k];
  const wt = oursW(m), fin = {};
  for (const k of KEYS) fin[k] = Math.max(0, m.final[k] + wt * (o1[k] - ours[k]));
  fin.min = min1;
  const gp = w.gp ?? m.gp ?? p.gp, gpf = w.gp == null && m.gpf != null ? m.gpf : gpfOf(gp, p.left);
  const g = gscore(fin);
  return {line: fin, ours: o1, minAuto, gp, ...g, val: dollars(g.pgv, gpf)};
}

// ---- player panel ----
function openPlayer(id, from) {
  X = {yid: id, back: from || (tab === 'player' ? X.back : tab), w: {}};
  tab = 'player'; show(); window.scrollTo(0, 0);
}
function lineRow(label, l, gp, cls = '', extra = '') {
  if (!l) return '';
  const g = gscore(l);
  return `<tr class="${cls}"><td class="l">${label}${extra}</td><td>${gp == null ? '–' : f1(gp, 0)}</td><td>${f1(l.min)}</td>`

  let s = String(name).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  s = s.replace(/-/g, ' ').replace(/\./g, '').replace(/[^a-z ]/g, '');

        && (!rec2.team || pmap()[id].team.slice(0, 2) === String(rec2.team).toUpperCase().slice(0, 2))).map(([id]) => id);

}

  rows += `<tr><td class="l">Categories a week vs the league, next three weeks</td>${sides.map(k => `<td>${cell(wk[k].before.exp, wk[k].after.exp)}</td>`).join('')}</tr>`;
  if (vs && vs.some(x => x[0])) {
    rows += `<tr><td class="l">${first ? 'Next' : 'This'} week (${esc(day(per.start))}): chance to win</td>${vs.map(([b, a]) => `<td>${b && a ? pc(b.win, a.win) + `<div class="meta">vs ${esc(teamName(b.opp))}</div>` : '–'}</td>`).join('')}</tr>`;
  }
  if (canTitle()) {
    rows += `<tr><td class="l">Make the playoffs</td>${sides.map(k => `<td>${tt(mv, k, 'po')}</td>`).join('')}</tr>
      <tr><td class="l">Win the title</td>${sides.map(k => `<td>${tt(mv, k, 'title')}</td>`).join('')}</tr>`;
  }
  h += `<h3>What it does</h3><div class="tblwrap"><table class="dt mvt"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  if (mv.kind !== 'trade' || mv.give.length !== mv.get.length) {
    const alt = sides.map(k => tw().alt[k]).filter(a => a && a.add);
    if (trade && alt.length) h += `<p class="sub">Without the trade: ${alt.map((a, i) => `${sides[i] === me ? 'you' : 'they'} could pick up ${esc(nmOf(a.add))} for ${esc(nmOf(a.drop))} (${sgn(a.exp - tw().base[sides[i]].exp)} a week)`).join('; ')}. The trade ideas are ranked against that.</p>`;
  }
  // this week's matchup for a stream, as the streams list scores it
  if (mv.kind === 'stream' && src && src.after && D.matchup) {
    const p0 = D.matchup.probs, p1 = src.after;
    h += `<h3>This week vs ${esc(D.matchup.opp_name)}</h3><p class="note">${cell(D.matchup.exp, D.matchup.exp + src.gain)} categories expected,
      ${pc(D.matchup.win, winProb(p1))} to win the week${src.days && src.days.length ? `. He starts ${src.days.map(wday).join(', ')}` : ''}.</p>
      <div class="tblwrap"><table class="dt"><thead><tr><th class="l"></th>${D.cats.map(c => `<th>${CAT[c]}</th>`).join('')}</tr></thead><tbody>
      <tr><td class="l">Now</td>${D.cats.map(c => `<td>${pct(p0[c])}</td>`).join('')}</tr>
      <tr class="hi"><td class="l">With him</td>${D.cats.map(c => `<td>${pct(p1[c])}${dl((p1[c] - p0[c]) * 100, 0)}</td>`).join('')}</tr></tbody></table></div>`;
  }
  // by category, against the league
  const catRow = (lab, p, b) => `<tr${b ? ' class="hi"' : ''}><td class="l">${lab}</td>${D.cats.map((c, j) => `<td>${pct(p[j])}${b ? dl((p[j] - b[j]) * 100, 0) : ''}</td>`).join('')}</tr>`;
  h += `<h3>Each category against the league</h3><p class="sub">Chance to win the category in a typical week against the average other team, before and after.</p>
    <div class="tblwrap"><table class="dt"><thead><tr><th class="l"></th>${D.cats.map(c => `<th>${CAT[c]}</th>`).join('')}</tr></thead><tbody>`
    + sides.map(k => catRow(k === me ? 'You now' : esc(teamName(k)) + ' now', wk[k].before.p) + catRow(k === me ? 'You after' : 'Them after', wk[k].after.p, wk[k].before.p)).join('')
    + '</tbody></table></div>';
  h += `<p class="sub">Categories a week: each day's best lineup on the real schedule (a player who changes teams bumps whoever he beats out),
    players back from the injured list rejoining and each team cut to 14, against each other team. Rest of season: every regular-season week from
    ${trade ? 'next week' : 'this week'}, injured players at their expected share of each week.
    ${canTitle() ? `Title odds: the rest of the season and the playoffs played ${TN.toLocaleString()} times from today's standings, on the real matchups;
    a player's projection miss carries over from week to week, and injured players' returns are drawn from how absences like theirs ran.
    ${trade ? 'A trade counts from next week (Yahoo holds it two days for review).' : 'A pickup counts from today.'}` : ''}</p>`;
  h += trade ? `<p class="note">To send it, ask Claude: it checks the roster first and needs your yes, and proposing sends a message to ${esc(teamName(T))}.</p>`
    : `<p class="note">Make it in the Yahoo app, or ask Claude (it checks the roster first and needs your yes).</p>`;
  return h + footer();
}

// ---- a player's fit and trades (top of his page) ----
function fitLine(fit) {
  const ch = Object.fromEntries(D.cats.map((c, j) => [c, fit.r.after.p[j] - fit.r.before.p[j]]).filter(([, v]) => Math.abs(v) >= 0.01).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])));
  const ros = canTitle() ? fit.score : null;
  return `<p>In place of ${esc(nmOf(fit.mv.myDrop[0]))}, the player you'd miss least: ${ros != null ? `<b>${sgn(ros)}</b> categories a week against the league over the rest of the season,
    ${sgn(fit.gain)} the next three weeks` : `<b>${sgn(fit.gain)}</b> categories a week against the league over the next three weeks`}.</p>${catChips(ch)}`;
}
function tradeCard(id) {
  if (!canMove()) return '';
  const p = pmap()[id], o = p && p.owner, L = D.model.league;
  if (!p || !lineP(id)) return '';
  let h = '';
  if (o === D.me) {
    h += `<h3>Trade him</h3><p class="sub">The best trades that move him: categories a week over the rest of the season, yours big, theirs after.</p>`
      + later('give:' + id, () => { const ideas = distinct(tradeSearch({give: id}), 5); return ideas.length ? tradeList(ideas) : `<p class="note">No trade that moves him helps you without costing the other team.</p>`; });
  } else if (o && L.teams[o]) {
    h += `<h3>Fit for your team</h3>` + later('fit:' + id, () => { const fit = bestSwap(id); return fit ? fitLine(fit) : ''; }, 'Working out his fit…');
    h += `<h3>Trades for him</h3>` + later('get:' + id, () => {
      let ideas = distinct(tradeSearch({get: id, team: o}), 4, m => m.give.join() + '>' + m.get.join());
      if (ideas.length) return `<p class="sub">With ${esc(teamName(o))}, best for you first: categories a week over the rest of the season, yours big, theirs after.</p>` + tradeList(ideas);
      ideas = distinct(tradeSearch({get: id, team: o, any: true}).filter(m => m.mine > 0), 3, m => m.give.join() + '>' + m.get.join());
      return ideas.length ? `<p class="note">No trade for him helps you without costing ${esc(teamName(o))}. These help you most, but they'd come out behind, so they'd likely say no.</p>` + tradeList(ideas)
        : `<p class="note">No trade for him helps your team.</p>`;
    });
  } else if (o === 'FA' || o === 'W') {
    const fit = bestSwap(id);
    if (fit) {
      const mv = mvOf({kind: 'add', myAdd: [id], myDrop: fit.mv.myDrop});
      h += `<h3>Fit for your team</h3>${fitLine(fit)}<ul class="list"><li class="mv tap" data-move="${regMove(mv)}" role="button" tabindex="0"><div class="split">
        <div class="nm">Add him, drop ${esc(lst(mv.myDrop))}</div><div class="rt">${canTitle() ? `title ${tt(mv, D.me, 'title', 'short')}` : ''}<span class="chev" aria-hidden="true">›</span></div></div></li></ul>`;
    }
  }
  return h ? `<div class="card fit">${h}</div>` : '';
}
function tradesWith(k) {               // Teams tab: the best trades with this team
  if (!canMove() || k === D.me || !tw().t[k]) return '';
  return `<h3>Trades with ${esc(teamName(k))}</h3><p class="sub">Best for you first: categories a week over the rest of the season, yours big, theirs after.
    Tap one for both teams' weekly and title odds.</p>` + later('team:' + k, () => {
    const ideas = distinct(tradeSearch({team: k}), 6);
    return ideas.length ? tradeList(ideas) : `<p class="note">No trade with them helps you without costing them right now.</p>`;
  });
}
$('view').addEventListener('click', e => {
  if (!D) return;
  if (e.target.id === 'mback') { tab = MX.back; show(); window.scrollTo(0, 0); return; }
  if (e.target.closest('[data-open]') || e.target.closest('.det')) return;
  const m = e.target.closest('[data-move]');
  if (m) openMove(MVS.get(m.dataset.move));
});
$('view').addEventListener('keydown', e => {
  const m = e.target.closest && e.target.closest('[data-move]');
  if (m && (e.key === 'Enter' || e.key === ' ') && e.target === m) { e.preventDefault(); openMove(MVS.get(m.dataset.move)); }
});

// ---- start ----
(async () => {
  const pass = store.get();
  if (pass) {
    try { D = await load(pass); land(); show(); return; } catch (e) { store.del(); }
  }
  $('lock').hidden = false;
})();
</script>
</body>
