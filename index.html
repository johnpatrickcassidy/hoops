<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoops">
<title>Hoops</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --ink: #14213D; --ink-2: #4A5568; --muted: #6B7689; --line: #DCE1E8;
  --us: #1F5FBF; --them: #D9661A; --mid: #E4E7EC; --amber: #F2B705; --amber-ink: #6B4E00; --amber-bg: #FFF6D6;
  --good: #0B7A0B; --bug: #14213D; --bug-ink: #F4F6F9; --bug-2: #A9B4C7; --bug-mid: #2A3651;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --text: 'Barlow', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131B2B; --surface: #1B2538; --ink: #EEF2F7; --ink-2: #B6C0CF; --muted: #8592A6; --line: #2A364C;
    --us: #4A86DC; --them: #DD7426; --mid: #2C374B; --amber-ink: #FFD866; --amber-bg: #3A3210;
    --good: #4CC24C; --bug: #0E1524; --bug-ink: #EEF2F7; --bug-2: #8592A6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131B2B; --surface: #1B2538; --ink: #EEF2F7; --ink-2: #B6C0CF; --muted: #8592A6; --line: #2A364C;
  --us: #4A86DC; --them: #DD7426; --mid: #2C374B; --amber-ink: #FFD866; --amber-bg: #3A3210;
  --good: #4CC24C; --bug: #0E1524; --bug-ink: #EEF2F7; --bug-2: #8592A6; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--text); font-variant-numeric: tabular-nums;
       -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--us); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* lock screen */
#lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
#lock form { width: 100%; max-width: 360px; }
.mark { font: 800 64px/0.9 var(--display); letter-spacing: 0.01em; margin: 0 0 8px; }
.mark span { display: block; font: 600 20px/1.2 var(--display); color: var(--muted); letter-spacing: 0.02em; }
#lock label { display: block; font-weight: 600; margin: 28px 0 6px; }
#lock input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
       background: var(--surface); font-size: 17px; }
.check { display: flex; gap: 8px; align-items: center; margin: 12px 0 20px; color: var(--ink-2); font-weight: 400 !important; }
.btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; cursor: pointer;
       background: var(--ink); color: var(--bg); }
.btn.wide { width: 100%; font-size: 17px; }
.btn.quiet { background: transparent; color: var(--ink-2); border: 1px solid var(--line); padding: 8px 14px; }
.err { color: var(--them); margin-top: 12px; min-height: 1.4em; }

/* scorebug */
.bug { position: sticky; top: 0; z-index: 5; background: var(--bug); color: var(--bug-ink);
       padding: calc(env(safe-area-inset-top) + 10px) 0 10px; }
.bug .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bug .score { font: 800 34px/1 var(--display); letter-spacing: 0.01em; white-space: nowrap; }
.bug .score .them { color: var(--bug-2); }
.bug .who { font-size: 14px; color: var(--bug-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bug .who b { color: var(--bug-ink); font-weight: 600; }
.lights { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-top: 10px; }
.light { border-radius: 5px; padding: 5px 0 4px; text-align: center; font: 600 15px/1 var(--display); color: var(--bug-ink);
         background: var(--bug-mid); letter-spacing: 0.02em; border: 0; cursor: pointer; }
.light.pg { color: var(--ink); cursor: default; }
.light.pg small { color: var(--ink-2); opacity: 1; }
.light small { display: block; font: 500 11px/1.2 var(--text); color: var(--bug-ink); opacity: 0.85; margin-top: 2px; }

/* layout */
main.page { padding: 16px 0 calc(env(safe-area-inset-bottom) + 84px); }
h2 { font: 800 28px/1.05 var(--display); margin: 26px 0 10px; letter-spacing: 0.01em; }
h2:first-child { margin-top: 6px; }
h3 { font: 600 17px/1.3 var(--text); margin: 18px 0 6px; }
p { margin: 6px 0; }
.sub { color: var(--muted); font-size: 14px; }
.note { color: var(--ink-2); font-size: 15px; }

/* action and status blocks */
.act { border-radius: 12px; padding: 14px 16px; margin: 10px 0; background: var(--amber-bg); color: var(--ink);
       border-left: 5px solid var(--amber); }
.act strong { display: block; font-size: 17px; margin-bottom: 4px; color: var(--amber-ink); }
.ok { display: flex; gap: 10px; align-items: center; padding: 12px 0; color: var(--ink-2); }
.ok svg { flex: none; color: var(--good); }
.banner { border-radius: 10px; padding: 10px 14px; background: var(--mid); color: var(--ink-2); font-size: 15px; margin: 6px 0 12px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); }
.list > li { padding: 11px 14px; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.pl { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
.slot { font: 600 15px/1 var(--display); color: var(--ink-2); text-align: center; border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 0; letter-spacing: 0.02em; }
.slot.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.nm { font-weight: 600; line-height: 1.25; }
.meta { font-size: 13.5px; color: var(--muted); }
.rt { text-align: right; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
        background: var(--mid); color: var(--ink); vertical-align: 1px; margin-left: 4px; }
.chip.out { background: var(--them); color: #fff; }
.chip.risk { background: var(--amber); color: #3B2B00; }
.chip.fa { background: transparent; border: 1px solid var(--us); color: var(--ink); }
.chip.me { background: var(--us); color: #fff; }
.chg { color: var(--amber-ink); font-weight: 600; font-size: 13.5px; }

/* moves */
.mv .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.gain { font: 800 24px/1 var(--display); white-space: nowrap; }
.gain small { font: 500 12px/1 var(--text); color: var(--muted); margin-left: 3px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cat { font-size: 12.5px; padding: 2px 7px; border-radius: 6px; background: var(--mid); }
.cat i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* matchup rows */
.mu { display: grid; grid-template-columns: 48px 1fr 54px; gap: 10px; align-items: center; padding: 10px 14px; }
.mu .k { font: 600 17px/1 var(--display); letter-spacing: 0.02em; }
.mu .nums { font-size: 13.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; white-space: nowrap; }
.mu .nums b { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 10px; border-radius: 4px; background: var(--mid); }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: 0.6; }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.mu .pct { font: 800 20px/1 var(--display); text-align: right; }
.legend { display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-2); margin: 6px 2px 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stats b { display: block; font: 800 26px/1 var(--display); }
.stats span { font-size: 13px; color: var(--muted); }

/* players */
.tools { display: grid; gap: 8px; margin-bottom: 10px; }
.tools input, .tools select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px;
              font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pr { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; cursor: pointer; }
.pr .n { color: var(--muted); font-size: 13px; text-align: right; }
.pr .v { font: 800 20px/1 var(--display); text-align: right; }
.pr .v small { display: block; font: 500 11.5px/1.3 var(--text); color: var(--muted); }
.detail { margin: 10px 0 2px 38px; font-size: 14px; color: var(--ink-2); }
.zs { display: grid; grid-template-columns: 38px 1fr 40px; gap: 6px 8px; align-items: center; margin: 8px 0; }
.zs .k { font: 600 14px/1 var(--display); letter-spacing: 0.02em; color: var(--ink); }
.zs .z { font-size: 12.5px; text-align: right; }
.ztrack { position: relative; height: 8px; background: var(--mid); border-radius: 3px; }
.ztrack .zero { position: absolute; left: 40%; top: -2px; bottom: -2px; width: 2px; background: var(--muted); opacity: 0.6; }
.ztrack .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.more { display: block; margin: 12px auto 0; }

/* league table */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; background: var(--surface);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { padding: 8px 2px; text-align: center; border-top: 1px solid var(--line); min-width: 22px; }
.tbl thead th { border-top: 0; font: 600 13px/1 var(--display); letter-spacing: 0.03em; color: var(--ink-2); }
.tbl td.team { text-align: left; padding-left: 10px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl tr.me td { font-weight: 700; }
.tbl td.r { font-weight: 600; }
.scroll { overflow-x: auto; }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
           padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 4px; }
nav.tabs button { appearance: none; background: none; border: 0; padding: 12px 0 13px; font-size: 14px; font-weight: 600;
                  color: var(--muted); cursor: pointer; position: relative; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
                  border-radius: 0 0 3px 3px; background: var(--us); }
.split { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 28px; }
@media (prefers-reduced-motion: no-preference) {
  .light, .track .fill { transition: background-color .3s, width .4s; }
}
</style>
</head>
<body>
<main id="lock">
  <form id="unlock" autocomplete="on">
    <h1 class="mark">Hoops<span>Your fantasy team, every day</span></h1>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this phone</label>
    <button class="btn wide" id="go" type="submit">Unlock</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="bug"><div class="wrap" id="bug"></div></header>
  <main class="page"><div class="wrap" id="view"></div></main>
  <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
</div>

<script>
'use strict';
const KEY = 'hoops-pass', ITER = 600000;
const CAT = {pts: 'PTS', reb: 'REB', ast: 'AST', stl: 'STL', blk: 'BLK', tpm: '3PM', to: 'TO', fg: 'FG%', ft: 'FT%'};
const TABS = [['today', 'Today'], ['matchup', 'Matchup'], ['moves', 'Moves'], ['players', 'Players'], ['league', 'League']];
let D = null, tab = 'today', P = {q: '', who: 'all', pos: 'all', sort: 'val', open: null, n: 60};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} },
};

// ---- decrypt: openssl enc -aes-256-cbc -pbkdf2 -md sha256 format, gzip inside ----
async function decrypt(b64, pass) {
  const bytes = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  if (new TextDecoder().decode(bytes.slice(0, 8)) !== 'Salted__') throw new Error('format');
  const salt = bytes.slice(8, 16), body = bytes.slice(16);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER}, km, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, body);
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function load(pass) {
  const r = await fetch('data.enc?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('fetch');
  return decrypt(await r.text(), pass);
}

$('unlock').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('pw').value;
  $('go').disabled = true; $('go').textContent = 'Unlocking…'; $('err').textContent = '';
  try {
    D = await load(pass);
    if ($('remember').checked) store.set(pass);
    show();
  } catch (x) {
    $('err').textContent = x.message === 'fetch' ? 'The data file did not load. Check your connection and try again.'
      : 'That passphrase did not unlock the data. Check it and try again.';
  }
  $('go').disabled = false; $('go').textContent = 'Unlock';
});

async function reload() {
  const pass = store.get();
  if (!pass) return;
  try { D = await load(pass); show(); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && D && Date.now() - new Date(D.built).getTime() > 20 * 60000) reload();
});

// ---- formatting ----
const ET = {timeZone: 'America/New_York'};
const day = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC'});
const wday = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', {weekday: 'short', timeZone: 'UTC'});
const tip = t => new Date(t).toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
const pct = p => Math.round(p * 100) + '%';
const sgn = (x, d = 2) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const val = (c, x, d = 1) => x == null ? '–' : (c === 'fg' || c === 'ft') ? x.toFixed(3).replace(/^0/, '')
  : (x >= 20 ? Math.round(x) : Math.round(x * 10 ** d) / 10 ** d).toString();
const todayET = () => new Date().toLocaleDateString('en-CA', ET);
function mix(a, b, t) {      // blend two #rrggbb colors
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function lean(p, strength = 1, base = '--mid') {   // diverging fill: neutral at 50%, us above, them below
  const t = Math.min(1, Math.abs(p - 0.5) * 2) * strength;
  return mix(css(base), css(p >= 0.5 ? '--us' : '--them'), t);
}
function status(s, ret) {
  if (!s) return '';
  const out = ['O', 'INJ', 'NA', 'SUSP', 'Out'].includes(s);
  const label = {O: 'Out', INJ: 'Injured', NA: 'Inactive', SUSP: 'Suspended', Q: 'Questionable', D: 'Doubtful', P: 'Probable',
                 GTD: 'Game-time', DTD: 'Day-to-day', 'Day-To-Day': 'Day-to-day'}[s] || s;
  return `<span class="chip ${out ? 'out' : 'risk'}">${esc(label)}${ret ? ' until ' + esc(day(ret)) : ''}</span>`;
}
const teamName = k => (D.teams || {})[k] || k;
const owner = o => !o ? '' : o === D.me ? '<span class="chip me">Yours</span>' : o === 'FA' ? '<span class="chip fa">Free agent</span>'
  : o === 'W' ? '<span class="chip fa">Waivers</span>' : `<span class="chip">${esc(teamName(o))}</span>`;
const catChips = bc => `<div class="cats">${Object.entries(bc || {}).slice(0, 5).map(([c, v]) =>
  `<span class="cat"><i style="background:${css(v >= 0 ? '--us' : '--them')}"></i>${CAT[c]} ${v > 0 ? '+' : '−'}${Math.round(Math.abs(v) * 100)}%</span>`).join('')}</div>`;

// ---- shell ----
function show() {
  $('lock').hidden = true; $('app').hidden = false;
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join('');
  render();
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) { tab = b.dataset.tab; show(); window.scrollTo(0, 0); }
});
$('bug').addEventListener('click', e => { if (e.target.closest('.light')) { tab = 'matchup'; show(); } });

function render() {
  renderBug();
  $('view').innerHTML = ({today, matchup, moves, players, league})[tab]();
}

function renderBug() {
  const m = D.matchup;
  if (!m) {
    $('bug').innerHTML = `<div class="row"><div class="score">Hoops</div><div class="who">Projections as of <b>${esc(day(D.proj.as_of))}</b></div></div>`;
    return;
  }
  const them = 9 - m.exp;
  $('bug').innerHTML = `
    <div class="row">
      <div class="score">${m.exp.toFixed(1)}<span class="them"> – ${them.toFixed(1)}</span></div>
      <div class="who">Week ${esc(D.week)} vs <b>${esc(m.opp_name)}</b>, ${pct(m.win)} to win</div>
    </div>
    <div class="lights">${D.cats.map(c => `<button class="light" style="background:${lean(m.probs[c], 0.8, '--bug-mid')}"
        aria-label="${CAT[c]}: ${pct(m.probs[c])} chance to win">${CAT[c].replace('%', '')}<small>${pct(m.probs[c])}</small></button>`).join('')}</div>`;
}

// ---- today ----
const check = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
function lineupBlock(L, first) {
  const changes = L.start.length || L.bench.length;
  let h = '';
  if (changes) {
    h += `<div class="act"><strong>Lineup needs changes</strong>
      ${L.start.length ? `<p>Start ${esc(L.start.join(', '))}.</p>` : ''}${L.bench.length ? `<p>Bench ${esc(L.bench.join(', '))}.</p>` : ''}
      <p class="note">In the Yahoo app, open ${first ? 'today' : esc(day(L.date))} and tap Start Active Players, or make these swaps.</p></div>`;
  } else if (L.playing) {
    h += `<div class="ok">${check}<span>Lineup is set. ${L.starts} of ${L.playing} players with a game are starting.</span></div>`;
  }
  if (L.idle.length) h += `<p class="note">No open slot for ${esc(L.idle.join(', '))}.</p>`;
  return h;
}
function playerRow(r) {
  const on = !['BN', 'IL', 'IL+'].includes(r.slot);
  const move = r.best !== r.slot ? `<div class="chg">${['BN', 'IL', 'IL+'].includes(r.best) ? 'Move to bench' : 'Start at ' + esc(r.best)}</div>` : '';
  const game = r.tip ? `${esc(r.opp || '')}, ${tip(r.tip)}${r.locked ? ' (started)' : ''}` : 'No game';
  const chance = r.tip && r.p != null && r.p < 0.995 ? `${pct(r.p)} to play` : '';
  return `<li class="pl"><div class="slot ${on ? 'on' : ''}">${esc(r.slot)}</div>
    <div><div class="nm">${esc(r.name)}${status(r.status)}</div><div class="meta">${esc(r.team)} ${esc(r.pos.join('/'))}. ${game}</div>${move}</div>
    <div class="rt">${chance}</div></li>`;
}
function today() {
  let h = '';
  if (D.error) h += `<div class="banner">${esc(D.error)}</div>`;
  const ls = D.lineups || [];
  const L = ls.find(l => l.date === todayET()) || ls[0];
  if (L) {
    h += `<h2>${esc(day(L.date))}</h2>` + lineupBlock(L, L.date === todayET());
    const groups = [['Playing', r => r.tip && !['IL', 'IL+'].includes(r.slot)], ['No game', r => !r.tip && !['IL', 'IL+'].includes(r.slot)],
                    ['Injured list', r => ['IL', 'IL+'].includes(r.slot)]];
    for (const [name, f] of groups) {
      const rows = L.players.filter(f);
      if (rows.length) h += `<h3>${name}</h3><ul class="list">${rows.map(playerRow).join('')}</ul>`;
    }
  }
  if ((D.alerts || []).length) h += `<h2>Roster</h2>` + D.alerts.map(a => `<div class="act"><p>${esc(a.replace(' — proposal', ''))}</p></div>`).join('');
  const rest = ls.filter(l => l !== L);
  if (rest.length) {
    h += `<h2>Rest of the week</h2><ul class="list">` + rest.map(l => {
      const n = l.start.length + l.bench.length;
      return `<li><div class="split">
        <div><div class="nm">${esc(day(l.date))}</div><div class="meta">${l.playing} with a game, ${l.starts} starting${l.idle.length ? `, no slot for ${esc(l.idle.join(', '))}` : ''}</div></div>
        <div class="rt">${n ? `<span class="chg">${n} change${n > 1 ? 's' : ''}</span>` : 'Set'}</div></div>
        ${n ? `<p class="note">${l.start.length ? 'Start ' + esc(l.start.join(', ')) + '. ' : ''}${l.bench.length ? 'Bench ' + esc(l.bench.join(', ')) + '.' : ''}</p>` : ''}</li>`;
    }).join('') + '</ul>';
  }
  if (!ls.length && !D.error) h += `<p class="note">No lineup data in this update.</p>`;
  return h + footer();
}
function footer() {
  const b = new Date(D.built);
  return `<div class="foot"><p class="sub">Updated ${esc(b.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'}))}, ${esc(tip(D.built))}.
    Box scores through ${esc(day(D.proj.through))}.</p><button class="btn quiet" onclick="lock()">Lock</button></div>`;
}
function lock() { store.del(); D = null; $('app').hidden = true; $('lock').hidden = false; $('pw').value = ''; }

// ---- matchup ----
function matchup() {
  const m = D.matchup;
  let h = '';
  if (!m) return `<h2>Matchup</h2><p class="note">${esc(D.error || 'No matchup data in this update.')}</p>` + footer();
  h += `<h2>Week ${esc(D.week)} vs ${esc(m.opp_name)}</h2>
    <p class="note">You're expected to win ${m.exp.toFixed(1)} of 9 categories, counting stats so far and every game left.</p>
    <div class="stats"><div><b>${pct(m.win)}</b><span>chance to win the week</span></div>
      <div><b>${m.games_mine}</b><span>games left for you</span></div><div><b>${m.games_theirs}</b><span>games left for them</span></div></div>
    <div class="legend"><span><i style="background:${css('--us')}"></i>You</span><span><i style="background:${css('--them')}"></i>${esc(m.opp_name)}</span></div>
    <ul class="list">` + D.cats.map(c => {
      const p = m.probs[c], w = Math.abs(p - 0.5) * 100;
      const fill = `left:${p >= 0.5 ? 50 : 50 - w}%;width:${w}%;background:${css(p >= 0.5 ? '--us' : '--them')}`;
      return `<li class="mu"><div class="k">${CAT[c]}</div><div>
        <div class="nums"><span>Now <b>${val(c, m.have_mine[c], 1)}</b>–${val(c, m.have_theirs[c], 1)}</span><span>Final <b>${val(c, m.proj_mine[c], 0)}</b>–${val(c, m.proj_theirs[c], 0)}</span></div>
        <div class="track" role="img" aria-label="${CAT[c]} ${pct(p)} chance to win"><div class="fill" style="${fill}"></div><div class="mid"></div></div></div>
        <div class="pct">${pct(p)}</div></li>`;
    }).join('') + '</ul><p class="sub">Final is the projected total for the week. TO: fewer wins. The percent is your chance to win the category.</p>';
  const n = D.next_week;
  if (n) h += `<h2>Next week vs ${esc(n.opp_name)}</h2><p class="note">${n.exp.toFixed(1)} of 9 categories expected, ${pct(n.win)} to win, before any moves.</p>`
    + `<div class="lights" style="margin:10px 0">${D.cats.map(c => `<div class="light pg" style="background:${lean(n.probs[c], 0.7)}">${CAT[c].replace('%', '')}<small>${pct(n.probs[c])}</small></div>`).join('')}</div>`;
  return h + footer();
}

// ---- moves ----
function moveItem(m, unit) {
  const w = m.add.avail === 'W' ? ' (waiver claim)' : '';
  const drop = m.drop ? `, drop ${esc(m.drop.name)}` : '';
  const days = m.days && m.days.length ? `<p class="meta">Starts ${m.days.map(wday).join(', ')}</p>` : '';
  return `<li class="mv"><div class="top"><div><div class="nm">Add ${esc(m.add.name)}${w}${drop}</div>
    <div class="meta">${esc(m.add.team)} ${esc((m.add.pos || []).join('/'))}</div></div>
    <div class="gain">${sgn(m.gain)}<small>${unit}</small></div></div>${catChips(m.by_cat)}${days}</li>`;
}
function moves() {
  let h = `<p class="note" style="margin-top:6px">Nothing here happens automatically. Make a move in the Yahoo app, or ask Claude to make it.</p>`;
  if (D.adds_used != null) h += `<p class="sub">Adds used this week: ${esc(D.adds_used)} of 3.</p>`;
  if (D.error && !D.streams) return h + `<div class="banner">${esc(D.error)}</div>` + footer();
  h += `<h2>Streams this week</h2>`;
  h += (D.streams || []).length ? `<p class="sub">Gain in expected categories won against ${esc(D.matchup ? D.matchup.opp_name : 'your opponent')} this week.</p><ul class="list">${D.streams.map(m => moveItem(m, 'cats')).join('')}</ul>`
    : `<p class="note">No pickup beats your roster this week. Save the add.</p>`;
  if (D.next_week && D.next_week.streams.length) h += `<h3>For next week</h3><ul class="list">${D.next_week.streams.map(m => moveItem(m, 'cats')).join('')}</ul>`;
  const il = D.il || {};
  if ((il.returning || []).length) {
    h += `<h2>Injured list returns</h2><p class="note">${il.returning.map(r => `${esc(r.name)} back ${esc(day(r.date))}`).join('. ')}. Each return needs a roster spot.</p>`;
    if ((il.options || []).length) h += `<ul class="list">${il.options.map((o, i) => `<li><div class="split">
        <div class="nm">Cut ${esc(o.cut.join(' and '))}</div><div class="rt">${o.exp.toFixed(2)} cats/wk${i === 0 ? '<div class="meta">best</div>' : ''}</div></div></li>`).join('')}</ul>`;
  }
  h += `<h2>Rest of season</h2>`;
  h += (D.adds || []).length ? `<p class="sub">Gain in categories won per week against the league.</p><ul class="list">${D.adds.map(m => moveItem(m, 'per wk')).join('')}</ul>`
    : `<p class="note">Your roster beats every free agent. Keep adds for streaming.</p>`;
  if ((D.trades || []).length) {
    h += `<h2>Trade ideas</h2><p class="sub">One-for-one trades that should help both teams. Proposing one sends a message to that manager.</p><ul class="list">`
      + D.trades.map(t => `<li class="mv"><div class="top"><div><div class="nm">Give ${esc(t.give.name)}, get ${esc(t.get.name)}</div>
        <div class="meta">From ${esc(t.team)}. Them ${sgn(t.theirs)} cats per week.</div></div><div class="gain">${sgn(t.mine)}<small>per wk</small></div></div></li>`).join('') + '</ul>';
  }
  return h + footer();
}

// ---- players ----
const POS = ['all', 'PG', 'SG', 'SF', 'PF', 'C'];
const SORTS = {val: ['Value', p => p.val + p.pgv / 100], mine: ['Fit for my team', p => p.mine], pg: ['Per game', p => p.pgv]};
function playerList() {
  const q = P.q.trim().toLowerCase();
  let ps = D.players.filter(p => (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase() === q)
    && (P.pos === 'all' || p.pos.split(',').includes(P.pos))
    && (P.who === 'all' || (P.who === 'avail' ? (p.owner === 'FA' || p.owner === 'W') : p.owner === D.me)));
  const key = SORTS[P.sort][1];
  return ps.sort((a, b) => key(b) - key(a));
}
function zbars(p) {
  return `<div class="zs">${D.cats.map((c, i) => {
    const z = Math.max(-2, Math.min(3, p.z[i])), left = 40 + Math.min(0, z) * 20, w = Math.abs(z) * 20;
    return `<span class="k">${CAT[c]}</span><div class="ztrack"><div class="fill" style="left:${left}%;width:${w}%;background:${css(z >= 0 ? '--us' : '--them')}"></div><div class="zero"></div></div><span class="z">${sgn(p.z[i], 1)}</span>`;
  }).join('')}</div>`;
}
function players() {
  const ps = playerList();
  const rows = ps.slice(0, P.n).map((p, i) => {
    const open = P.open === p.id;
    const sv = P.sort === 'val' ? ['$' + p.val.toFixed(1), 'value'] : P.sort === 'mine' ? [p.mine.toFixed(2), 'fit'] : [p.pgv.toFixed(2), 'per game'];
    return `<li><div class="pr" data-id="${esc(p.id)}" role="button" aria-expanded="${open}"><div class="n">${i + 1}</div>
      <div><div class="nm">${esc(p.name)}${status(p.status, p.ret)}</div><div class="meta">${esc(p.team)} ${esc(p.pos.replace(/,/g, '/'))} ${owner(p.owner)}</div></div>
      <div class="v">${sv[0]}<small>${sv[1]}</small></div></div>
      ${open ? `<div class="detail"><p><b>Per game:</b> ${esc(p.line)}</p>${p.wk && p.wk !== p.line ? `<p><b>This week:</b> ${esc(p.wk)}</p>` : ''}
        <p>${p.min} minutes. Plays about ${p.gp} of ${p.left} games left. Confidence ${esc(p.conf ?? '–')} of 10.</p>
        ${p.note ? `<p>${esc(p.note)}</p>` : ''}${zbars(p)}<p class="sub">Bars: category value per game against rosterable players (0 = average).</p></div>` : ''}</li>`;
  }).join('');
  return `<h2>Players</h2><div class="tools">
      <input id="q" type="search" placeholder="Search name or team" value="${esc(P.q)}" aria-label="Search players">
      <div class="seg" id="who">${[['all', 'Everyone'], ['avail', 'Available'], ['mine', 'My team']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${P.who === k}">${l}</button>`).join('')}</div>
      <div class="seg" id="pos">${POS.map(k => `<button data-v="${k}" aria-pressed="${P.pos === k}">${k === 'all' ? 'All positions' : k}</button>`).join('')}</div>
      <select id="sort" aria-label="Sort by">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${P.sort === k ? 'selected' : ''}>Sort by ${l.toLowerCase()}</option>`).join('')}</select>
    </div><ul class="list" id="plist">${rows || '<li class="note">No players match. Clear the search or pick another filter.</li>'}</ul>
    ${ps.length > P.n ? `<button class="btn quiet more" id="more">Show more (${ps.length - P.n} left)</button>` : ''}` + footer();
}
$('view').addEventListener('click', e => {
  if (tab !== 'players') return;
  const seg = e.target.closest('.seg button');
  if (seg) { P[seg.parentElement.id] = seg.dataset.v; P.n = 60; return render(); }
  if (e.target.id === 'more') { P.n += 60; return render(); }
  const row = e.target.closest('.pr');
  if (row) { P.open = P.open === row.dataset.id ? null : row.dataset.id; render(); }
});
$('view').addEventListener('input', e => {
  if (e.target.id === 'q') {
    P.q = e.target.value; P.n = 60;
    const pos = e.target.selectionStart; render();
    const q = $('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});
$('view').addEventListener('change', e => { if (e.target.id === 'sort') { P.sort = e.target.value; render(); } });

// ---- league ----
function league() {
  if (!D.table) return `<h2>League</h2><p class="note">${esc(D.error || 'No league data in this update.')}</p>` + footer();
  const shade = r => mix(css('--surface'), css('--us'), (10 - r) / 9 * 0.45);
  let h = `<h2>League</h2><p class="note">Expected categories won per week against everyone else, with each team's rank in every category (1 is best; TO counts fewest as best).</p>
    <div class="scroll"><table class="tbl"><thead><tr><th style="text-align:left;padding-left:12px">Team</th><th>Wins</th>${D.cats.map(c => `<th>${CAT[c].replace('%', '')}</th>`).join('')}</tr></thead><tbody>`
    + D.table.map(t => `<tr class="${t.key === D.me ? 'me' : ''}"><td class="team">${esc(t.name)}</td><td class="r">${t.exp.toFixed(2)}</td>
        ${t.ranks.map(r => `<td style="background:${shade(r)}">${r}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
  const o = D.outlook;
  if (o) h += `<h3>Your chance against an average team</h3><div class="lights">${D.cats.map(c => `<div class="light pg" style="background:${lean(o.probs[c], 0.7)}">${CAT[c].replace('%', '')}<small>${pct(o.probs[c])}</small></div>`).join('')}</div>`;
  return h + footer();
}

// ---- start ----
(async () => {
  const pass = store.get();
  if (pass) {
    try { D = await load(pass); show(); return; } catch (e) { store.del(); }
  }
  $('lock').hidden = false;
})();
</script>
</body>
</html>
